<!DOCTYPE html>
<html lang ="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="input">
            <input id="display" readonly/>
        </div>
        <div id="keys">
            <button class="top-three" id="clearButton" class="operator-btn" onclick="clearDisplay()">C</button>
            <button class="top-three" class="operator-btn" onclick="convertValue()">+/-</button>
            <button class="top-three" class="operator-btn " onclick="appendToDisplay('%')">%</button>
            <button class="operator" class="operator-btn" onclick="appendToDisplay('/')">/</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" class=" operator-btn" onclick="appendToDisplay('*')">x</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('-')" class="operator" class="operator-btn">-</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" class="operator-btn" onclick="appendToDisplay('+')">+</button>
            <button onclick="backSpace()">&#9003;</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="operator" id="evaluator">=</button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
